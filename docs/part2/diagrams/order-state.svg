st="spacing" textLength="204.6406" x="411.5" y="180.752">Edit items only in Placed (BR17).</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="181.3164" x="411.5" y="198.3613">Reuse original time/load/rain.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="232.7021" x="411.5" y="215.9707">Edit does not change the Order state.</text></g><g class="entity" data-entity="GMN5" data-source-line="37" data-uid="ent0006" id="entity_GMN5"><path d="M715.5,600.2188 L715.5,627.7188 L680.81,631.7188 L715.5,635.7188 L715.5,663.0469 A0,0 0 0 0 715.5,663.0469 L1027.5537,663.0469 A0,0 0 0 0 1027.5537,663.0469 L1027.5537,610.2188 L1017.5537,600.2188 L715.5,600.2188 A0,0 0 0 0 715.5,600.2188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1017.5537,600.2188 L1017.5537,610.2188 L1027.5537,610.2188 L1017.5537,600.2188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="180.5166" x="721.5" y="619.752">Assignment policy is AMB01:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="291.0537" x="721.5" y="637.3613">proposed manual Admin assignment at Ready;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="228.7783" x="721.5" y="654.9707">not an extra Order state or transition.</text></g><g class="entity" data-entity="GMN8" data-source-line="42" data-uid="ent0009" id="entity_GMN8"><path d="M6,458.2188 L6,503.4375 A0,0 0 0 0 6,503.4375 L303.2539,503.4375 A0,0 0 0 0 303.2539,503.4375 L303.2539,484.7188 L338.28,480.7188 L303.2539,476.7188 L303.2539,468.2188 L293.2539,458.2188 L6,458.2188 A0,0 0 0 0 6,458.2188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M293.2539,458.2188 L293.2539,468.2188 L303.2539,468.2188 L293.2539,458.2188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="276.2539" x="12" y="477.752">FULL simulated refund if paid online (BR16).</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="189.875" x="12" y="495.3613">Retain order, lines and history.</text></g><g class="entity" data-entity="GMN11" data-source-line="46" data-uid="ent0012" id="entity_GMN11"><path d="M513,897.2188 L513,915.7188 L477.57,919.7188 L513,923.7188 L513,942.4375 A0,0 0 0 0 513,942.4375 L805.6055,942.4375 A0,0 0 0 0 805.6055,942.4375 L805.6055,907.2188 L795.6055,897.2188 L513,897.2188 A0,0 0 0 0 513,897.2188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M795.6055,897.2188 L795.6055,907.2188 L805.6055,907.2188 L795.6055,897.2188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="237.3232" x="519" y="916.752">Financial policy after Failed is AMB02;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="271.6055" x="519" y="934.3613">BR16 cancellation refund is a separate rule.</text></g><!--link *start* to Placed--><g class="link" data-entity-1="*start*" data-entity-2="Placed" data-source-line="19" data-uid="lnk3" id="link_*start*_Placed"><path d="M343.5,82.5187 C343.5,101.8288 343.5,140.6387 343.5,166.4588" fill="none" id="*start*-to-Placed" style="stroke:#735344;stroke-width:1;"/><polygon fill="#735344" points="343.5,172.4588,347.5,163.4588,343.5,167.4588,339.5,163.4588,343.5,172.4588" style="stroke:#735344;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="133.8408" x="344.5" y="127.752">successful placement</text></g><!--link Placed to Confirmed--><g class="link" data-entity-1="Placed" data-entity-2="Confirmed" data-source-line="20" data-uid="lnk4"