 x="290.4956" y="1061.752">Check every action in the business layer, including actor scope.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="440.4941" x="290.4956" y="1079.3613">Delivered, Cancelled and Failed have no outgoing business transitions.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="390.6123" x="290.4956" y="1096.9707">Reject every unlisted transition; UI visibility alone is insufficient.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="343.957" x="290.4956" y="1114.5801">Initial/final arrows are not the eight business transitions.</text><text fill="#888888" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="191.626" x="414.9297" y="1146.0371">Team 3 | 524H0072, 524H0189, 524H0188</text><!--SRC=[ZLLDRziu4BthLmpQItUH3plVwm054iT2YwQR8avEZGyqDRHcGv5QaahgeZz-Xn8bEzriiITJvEFCUs-6uq118zou0XrSaqAvbloz2sSm3oAWXtrUNZQU37eFTquOJu6iyG_cydPypCVySzBzdC8Fk9-EnY1C0H_kHeUPiZPmu3iK5HpowV71qOVHwFHWfrkDp_uOLcUPVoHJ2yVGfP2FAsSRKqojjWxUvda-pO-t4BuKXNqcim8bjCUjamALQ7J8hGb_YWfXpepdw4YzZfdJTuJnqNRegFlo5GP7L_c_O3OQbo2dXyU7HzkHBfoppoyFIoeGiAh3cabuwQYEPcPjCFYYXSGYVKojKUIguVkBGuxAYjFtBOfYdTPlRfe0YjDSeQOdTEit83pmPZfFsrZ0szb9FfgD-np2IDGwxkVJsTdi8EtdWhOtl_w-WDtTzuaVJC0tKd8xg4P37VSgD25Bfn4uS6Vi9mgoH1FRIQa7yzK-6oYRvU85Vk0nWMdZWwsuQLfaw-_YmR2s5u6WZtCE3eMtXd_-ReWbBh9DzfPqxzklkBoyyh_eN1GLcMmJFLviQ_AhF1qWGcF59Z0lgQxHCKHuJol3AOE5K99FgRA8Y_XD2ISmO3VNhT7yGdThGGNStCBqvWgay2N8NjWcKYhkgs5ahxOnRAiinLBZ8jlaZlUv6xADG_rEYjf_6dxtu6XL1h2gRso0MK41A635-enU0vc-gTx5-V7R7cDkiV78ycb5HcW8LE6-jgBOTuBCNX-ai3oRE0imIRD2zgoVOcqBxsN8CoYo-8bAzsm0BbhniN6XjfeaS_5myVboD9xmQUriRJtJgeHfc4HRx6HOUqU4Bj8vWoCBOG2_1IUsER062CF0_9cHHjKI6gpaIFdzzJLugXhDrmjkQSK324X1MzUkngrJ9ycfm9PqdR83yT2tevVR9rYt_ayFkbh5VEomaSG2amT2nN6TQfaCEOWQso4lEweYoXd8SKhmyH54nQxHszPhNCNrqWRkAeuoBL4-0iO91KAsOPX_BDso_uVHOXt5a96wAUAxOXpxwAMjCMeUUd5dwvb6qObqAPwGauDjmih6-qFaJIbyPz